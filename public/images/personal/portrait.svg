<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="사진을 넣어주세요">
  <defs>
    <linearGradient id="g" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d9b892"/><stop offset="1" stop-color="#8a6a4f"/>
    </linearGradient>
    <radialGradient id="v" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2b1c" stop-opacity=".34"/>
    </radialGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#g)"/>
  <rect width="900" height="1200" fill="url(#v)"/>
  <rect width="900" height="1200" filter="url(#n)" opacity=".13" style="mix-blend-mode:overlay"/>
  <g font-family="'Gowun Batang','Noto Serif KR',serif" fill="#fffaf0" opacity=".72" text-anchor="middle">
    <text x="450" y="600" font-size="56">사진을 넣어주세요</text>
    <text x="450" y="654" font-size="26" opacity=".7">public / images / personal</text>
  </g>
</svg>
