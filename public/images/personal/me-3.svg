      <stop offset="0" stop-color="#dcc0a0"/><stop offset="1" stop-color="#8f6c50"/>
    </linearGradient>
    <radialGradient id="v" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
