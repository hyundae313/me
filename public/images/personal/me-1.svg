<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="내 사진 · 가로">
  <defs>
    <linearGradient id="g" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d8bb98"/><stop offset="1" stop-color="#8a6a4d"/>
    </linearGradient>
    <radialGradient id="v" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2b1c" stop-opacity=".34"/>
    </radialGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#g)"/>
  <rect width="1500" height="1000" fill="url(#v)"/>
  <rect width="1500" height="1000" filter="url(#n)" opacity=".13" style="mix-blend-mode:overlay"/>
  <g font-family="'Gowun Batang','Noto Serif KR',serif" fill="#fffaf0" opacity=".72" text-anchor="middle">
    <text x="750" y="500" font-size="68">내 사진 · 가로</text>
    <text x="750" y="562" font-size="34" opacity=".7">내 사진 넣을 자리</text>
  </g>
</svg>
