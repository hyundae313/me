name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 방문 로그 수집 주소. 저장소 Secrets 에 없으면 빈 값이 되고 추적은 꺼집니다.
      - run: npm run build
        env:
          VITE_TRACK_ENDPOINT: ${{ secrets.VITE_TRACK_ENDPOINT }}

      # 클라이언트 라우팅(/dev)을 새로고침해도 열리도록 404 도 index.html 로 둡니다.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
